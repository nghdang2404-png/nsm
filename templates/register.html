{% extends "base.html" %}

{% block title %}Đăng ký tài khoản mới - Hệ thống Nam Sương{% endblock %}

{% block content %}
<div class="container py-3" style="max-width: 550px;">
    <div class="card p-4 bg-white shadow-sm border-0" style="border-radius: 10px;">
        <div class="text-center mb-4">
            <h4 class="fw-bold text-danger mb-1">
                <i class="fa-solid fa-user-plus me-2"></i> Đăng Ký Tài Khoản
            </h4>
            <p class="text-muted small m-0">
                Tạo tài khoản truy cập hệ thống cho nhân viên các bộ phận.
            </p>
        </div>

        <form action="{{ url_for('register') }}" method="POST" id="registerForm">
            
            <!-- Trường Họ và tên -->
            <div class="mb-3">
                <label class="form-label fw-semibold small text-secondary">Họ và tên:</label>
                <input type="text" name="ho_ten" class="form-control form-control-sm" placeholder="Nhập họ và tên nhân viên..." autocomplete="off">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold small text-secondary">Tên đăng nhập:</label>
                <input type="text" name="username" class="form-control form-control-sm" placeholder="Nhập tên đăng nhập..." required autocomplete="off">
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold small text-secondary">Mật khẩu:</label>
                    <input type="password" id="password" name="password" class="form-control form-control-sm" placeholder="Nhập mật khẩu..." required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold small text-secondary">Nhập lại mật khẩu:</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control form-control-sm" placeholder="Xác nhận mật khẩu..." required>
                </div>
            </div>

            <div id="passwordError" class="text-danger small mb-3 d-none">
                <i class="fa-solid fa-triangle-exclamation me-1"></i> Mật khẩu xác nhận không trùng khớp!
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold small text-secondary">Bộ phận làm việc:</label>
                <input type="text" name="bo_phan" class="form-control form-control-sm" placeholder="VD: Kế toán dịch vụ, Phụ tùng...">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold small text-secondary">Khu vực làm việc:</label>
                <select name="khu_vuc" class="form-select form-select-sm" required>
                    <option value="" disabled selected>-- Chọn khu vực --</option>
                    <option value="Cà Mau">Cà Mau</option>
                    <option value="Bạc Liêu">Bạc Liêu</option>
                </select>
            </div>

            <div class="mb-4 form-check bg-light p-2 rounded border ms-0 ps-4">
                <input type="checkbox" name="is_admin" value="yes" class="form-check-input" id="adminCheck">
                <label class="form-check-label small fw-semibold text-danger ms-2" for="adminCheck">
                    Cấp quyền Quản trị viên (Admin)
                </label>
            </div>

            <button type="submit" class="btn btn-danger w-100 fw-semibold py-2" style="background-color: #dc3545; border: none;">
                <i class="fa-solid fa-check me-1"></i> Tạo tài khoản
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        const pass = document.getElementById('password').value;
        const confirmPass = document.getElementById('confirm_password').value;
        const errorDiv = document.getElementById('passwordError');

        if (pass !== confirmPass) {
            e.preventDefault();
            errorDiv.classList.remove('d-none');
        } else {
            errorDiv.classList.add('d-none');
        }
    });
</script>
{% endblock %}
