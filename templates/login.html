<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Đăng nhập Nam Sương Motor</title>
    <!-- Giữ lại FontAwesome để hiển thị icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <!-- FONT SVN-MONASANS (tự host) - dùng chung 1 file cho mọi độ đậm, xem giải thích
         chi tiết trong home.html (nơi khai báo font-face gốc). -->
    <style>
        @font-face {
            font-family: 'SVN-Monasans';
            src: url("{{ url_for('static', filename='fonts/SVN-MonaSans-SemiBoldWide.otf') }}") format('opentype');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }
    </style>
    <style>
        /* =========================================
           1. RESET CSS - KHÔNG KẾ THỪA TỪ ĐÂU
        ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'SVN-Monasans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* =========================================
           2. BỐ CỤC TOÀN MÀN HÌNH (DESKTOP + MOBILE)
        ========================================= */
        html, body {
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fa;
        }

        /* =========================================
           3. KHUNG ĐĂNG NHẬP (FORM CONTAINER)
        ========================================= */
        .login-container {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            margin: 20px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            border: 1px solid #e5e7eb;
            border-top: 4px solid #dc3545;
        }

        /* =========================================
           4. KHU VỰC LOGO & TIÊU ĐỀ
        ========================================= */
        .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-area img {
            max-width: 160px;
            height: auto;
            margin-bottom: 15px;
            object-fit: contain;
        }

        .logo-area h1 {
            font-size: 22px;
            color: #dc3545;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* =========================================
           5. KHU VỰC THÔNG BÁO LỖI (FLASH MESSAGES)
        ========================================= */
        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
            font-weight: 500;
        }
        
        .alert-error, .alert-danger {
            background-color: #fef2f2;
            color: #991b1b;
            border: 1px solid #f87171;
        }

        .alert-success {
            background-color: #f0fdf4;
            color: #166534;
            border: 1px solid #4ade80;
        }

        /* =========================================
           6. Ô NHẬP LIỆU (INPUT FIELDS)
        ========================================= */
        .input-group {
            display: flex;
            align-items: center;
            background: #f9fafb;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            margin-bottom: 16px;
            padding: 0 14px;
            transition: all 0.3s ease;
        }

        .input-group:focus-within {
            border-color: #dc3545;
            box-shadow: 0 0 0 3px rgba(220, 53, 69, 0.15);
            background: #ffffff;
        }

        .input-group label {
            color: #6b7280;
            padding-right: 12px;
            font-size: 16px;
        }

        .input-group input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 14px 0;
            font-size: 15px;
            color: #111827;
            outline: none;
            width: 100%;
        }

        .input-group input::placeholder {
            color: #9ca3af;
        }

        /* =========================================
           7. CHECKBOX NHỚ ĐĂNG NHẬP
        ========================================= */
        .remember-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .remember-group label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #4b5563;
            user-select: none;
        }

        .remember-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #dc3545;
        }

        /* =========================================
           8. NÚT ĐĂNG NHẬP & ĐĂNG KÝ
        ========================================= */
        .login-btn {
            width: 100%;
            background-color: #dc3545;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .login-btn:hover {
            background-color: #b02a37;
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .register-link-container {
            text-align: center;
            margin-top: 18px;
        }

        .register-link-container a {
            font-size: 14px;
            color: #4b5563;
            text-decoration: none;
            transition: color 0.2s;
        }

        .register-link-container a span {
            color: #dc3545;
            font-weight: 600;
        }

        .register-link-container a:hover span {
            text-decoration: underline;
        }

        /* =========================================
           9. RESPONSIVE CHO ĐIỆN THOẠI
        ========================================= */
        @media (max-width: 480px) {
            html, body {
                background-color: #ffffff;
                align-items: flex-start;
            }

            .login-container {
                margin: 0;
                padding: 40px 20px;
                border-radius: 0;
                box-shadow: none;
                border: none;
                border-top: 4px solid #dc3545;
                max-width: 100%;
            }

            .logo-area h1 {
                font-size: 20px;
            }

            .input-group input {
                font-size: 16px;
                padding: 12px 0;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Logo và Header -->
        <div class="logo-area">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo Nam Sương Motor" onerror="this.style.display='none'">
            <h1>ĐĂNG NHẬP HỆ THỐNG</h1>
        </div>

        <!-- Thông báo lỗi -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        <i class="fas fa-exclamation-triangle"></i> {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Form nhập liệu -->
        <form method="POST">
            <div class="input-group">
                <label for="username"><i class="fas fa-user"></i></label>
                <input type="text" id="username" name="username" placeholder="Tên đăng nhập" required autocomplete="username">
            </div>
            
            <div class="input-group">
                <label for="password"><i class="fas fa-lock"></i></label>
                <input type="password" id="password" name="password" placeholder="Mật khẩu" required autocomplete="current-password">
            </div>
            
            <div class="remember-group">
                <label>
                    <input type="checkbox" name="remember" checked>
                    Nhớ phiên đăng nhập (30 ngày)
                </label>
            </div>
            
            <button type="submit" class="login-btn">ĐĂNG NHẬP</button>

            <!-- Nút chuyển sang trang Đăng ký -->
            <div class="register-link-container">
                <a href="{{ url_for('register') }}">
                    Chưa có tài khoản? <span>Đăng ký ngay</span>
                </a>
            </div>
        </form>
    </div>

</body>
</html>
